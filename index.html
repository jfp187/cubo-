<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>Hello WebXR con Modelos 3D!</title>

  <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
  <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<button onclick="activateXR()">Start Hello WebXR</button>

<script>
// Variables globales
let xrSession = null;
let gl = null;
let renderer = null;
let scene = null;
let camera = null;
let referenceSpace = null;

// Variables para nuestros modelos 3D
let reticle = null;
let flower = null;

async function activateXR() {
  const canvas = document.createElement("canvas");
  document.body.appendChild(canvas);
  gl = canvas.getContext("webgl", { xrCompatible: true });

  xrSession = await navigator.xr.requestSession("immersive-ar", {
    requiredFeatures: ['local'] 
  });

  document.querySelector('button').style.display = 'none';

  xrSession.updateRenderState({
    baseLayer: new XRWebGLLayer(xrSession, gl)
  });

  referenceSpace = await xrSession.requestReferenceSpace('local');

  // Inicializar la Escena de Three.js
  scene = new THREE.Scene();

  // WebXR requiere luces para que los modelos GLTF con texturas no se vean completamente negros
  const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
  scene.add(ambientLight);

  // Instanciar el cargador de GLTF AHORA que la escena ya existe
  const loader = new THREE.GLTFLoader();

  // Cargar la Retícula
  loader.load("https://immersive-web.github.io/webxr-samples/media/gltf/reticle/reticle.gltf", function(gltf) {
    reticle = gltf.scene;
    reticle.position.set(0, 0, -1); // Posición inicial visible temporalmente 
    scene.add(reticle);
  });

  // Cargar el Girasol
  loader.load("https://immersive-web.github.io/webxr-samples/media/gltf/sunflower/sunflower.gltf", function(gltf) {
    flower = gltf.scene;
    flower.position.set(0, -0.5, -1.5); // Lo posicionamos un poco al fondo
    scene.add(flower);
  });

  // Configurar Cámara y Renderer
  camera = new THREE.PerspectiveCamera();
  camera.matrixAutoUpdate = false; 

  renderer = new THREE.WebGLRenderer({
    alpha: true,
    preserveDrawingBuffer: true,
    canvas: canvas,
    context: gl
  });
  renderer.autoClear = false;

  // Iniciar el ciclo de renderizado
  xrSession.requestAnimationFrame(onXRFrame);
}

// El ciclo de animación (Unificado y sin duplicados)
const onXRFrame = (time, frame) => {
  xrSession.requestAnimationFrame(onXRFrame);

  gl.bindFramebuffer(gl.FRAMEBUFFER, xrSession.renderState.baseLayer.framebuffer);

  const pose = frame.getViewerPose(referenceSpace);
  if (pose) {
    const view = pose.views[0];
    const viewport = xrSession.renderState.baseLayer.getViewport(view);
    
    renderer.setSize(viewport.width, viewport.height);

    camera.matrix.fromArray(view.transform.matrix);
    camera.projectionMatrix.fromArray(view.projectionMatrix);
    camera.updateMatrixWorld(true);

    // Animación opcional: Hacer que el girasol rote un poco si ya terminó de cargar
    if (flower) {
      flower.rotation.y += 0.01;
    }

    renderer.render(scene, camera);
  }
};
</script>
</body>
</html>
