<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Prueba de AR</title>
    <!-- Cargamos la versión estable de A-Frame -->
    <script src="https://aframe.io"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- Mensaje de ayuda en pantalla que solo se ve antes de entrar a AR -->
    <div style="position: absolute; top: 20px; left: 20px; z-index: 10; color: white; font-family: sans-serif; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 5px;">
      <p style="margin: 0 0 5px 0;">1. Si estás en PC, dale al botón <strong>"VR"</strong> abajo a la derecha.</p>
      <p style="margin: 0;">2. Si estás en Celular, dale al botón <strong>"AR"</strong> para abrir tu cámara.</p>
    </div>

    <!-- Escena configurada con WebXR nativo -->
    <a-scene xrweb="optionalFeatures: hit-test;" webxr="requiredFeatures: hit-test;">
      
      <a-assets>
        <!-- Modelo 3D de una pequeña ciudad/auto de prueba -->
        <a-asset-item id="ciudad" src="https://aframe.io"></a-asset-item>
      </a-assets>

      <!-- Este modelo se verá directamente en el centro si estás en PC -->
      
      

      <!-- Fondo y luces básicas para que la pantalla NO se quede negra en la computadora -->
      <a-sky color="#222" hide-on-enter-ar></a-sky>
      <a-light type="ambient" color="#fff"></a-light>
      <a-light type="directional" position="1 3 2" intensity="0.5"></a-light>

      
    </a-scene>

  </body>
</html>
