```html
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Marcador Hiro -->
    <a-marker preset="hiro">

        <a-box
            position="-1 0.5 0"
            rotation="0 45 0"
            color="#4CC3D9">
        </a-box>

        <a-sphere
            position="0 1 0"
            radius="0.5"
            color="#EF2D5E">
        </a-sphere>

        <a-cylinder
            position="1 0.75 0"
            radius="0.3"
            height="1.5"
            color="#FFC65D">
        </a-cylinder>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
```
