<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>Hello WebXR!</title>

  <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
</head>
<body>

<button onclick="activateXR()">Start Hello WebXR</button>

<script>
// 1. Declarar variables globales para que estén accesibles en todo el script
let xrSession = null;
let gl = null;
let renderer = null;
let scene = null;
let camera = null;
let referenceSpace = null;

async function activateXR() {
  // 2. Añadir el canvas e inicializar WebGL con compatibilidad XR
  const canvas = document.createElement("canvas");
  document.body.appendChild(canvas);
  gl = canvas.getContext("webgl", { xrCompatible: true });

  // 3. Solicitar formalmente la sesión de Realidad Aumentada
  xrSession = await navigator.xr.requestSession("immersive-ar", {
    requiredFeatures: ['local'] 
  });

  // Ocultar el botón una vez iniciada la sesión
  document.querySelector('button').style.display = 'none';

  // 4. Configurar el "Layer" (capa donde WebXR dibujará)
  xrSession.updateRenderState({
    baseLayer: new XRWebGLLayer(xrSession, gl)
  });

  // 5. Obtener el espacio de referencia (coordenadas del mundo real)
  referenceSpace = await xrSession.requestReferenceSpace('local');

  // 6. Inicializar componentes mínimos de Three.js
  scene = new THREE.Scene();

  // Creamos un cubo rápido de 20cm para tener algo que ver en la pantalla
  const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
  const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
  const cube = new THREE.Mesh(geometry, material);
  cube.position.set(0, 0, -1); // 1 metro frente a la cámara
  scene.add(cube);

  // Configuramos la cámara y el renderer vinculándolos al contexto de WebGL
  camera = new THREE.PerspectiveCamera();
  camera.matrixAutoUpdate = false; // WebXR controlará la matriz de la cámara

  renderer = new THREE.WebGLRenderer({
    alpha: true,
    preserveDrawingBuffer: true,
    canvas: canvas,
    context: gl
  });
  renderer.autoClear = false;

  // 7. INICIAR EL BUCLE (Solo ocurre tras la interacción del usuario)
  xrSession.requestAnimationFrame(onXRFrame);
}

// 8. El render loop (Bucle de animación único)
const onXRFrame = (time, frame) => {
  // Volver a solicitar el siguiente cuadro de animación
  xrSession.requestAnimationFrame(onXRFrame);

  // Vincular el framebuffer de gráficos a WebXR
  gl.bindFramebuffer(gl.FRAMEBUFFER, xrSession.renderState.baseLayer.framebuffer);

  // Obtener la posición y orientación del dispositivo en el espacio real
  const pose = frame.getViewerPose(referenceSpace);
  if (pose) {
    // En web AR móvil casi siempre hay una sola vista (la pantalla del celular)
    const view = pose.views[0];
    const viewport = xrSession.renderState.baseLayer.getViewport(view);
    
    renderer.setSize(viewport.width, viewport.height);

    // Sincronizar las matrices de la cámara de Three.js con el dispositivo real
    camera.matrix.fromArray(view.transform.matrix);
    camera.projectionMatrix.fromArray(view.projectionMatrix);
    camera.updateMatrixWorld(true);

    // Renderizar la escena final
    renderer.render(scene, camera);
  }
};
</script>
</body>
</html>
